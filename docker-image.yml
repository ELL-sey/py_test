name: Build and Push Docker Image

on:
  push:
    branches: [ "stage" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: elipsey/${{ env.PROJECT_NAME }}:dev_${{ github.sha }}
          cache-from: type=registry,ref=elipsey/${{ env.PROJECT_NAME }}:cache
          cache-to: type=registry,ref=elipsey/${{ env.PROJECT_NAME }}:cache,mode=max

    env:
      PROJECT_NAME: py_test